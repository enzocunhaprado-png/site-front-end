<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Marvel: Os Vingadores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">MARVEL</div>
            <ul class="nav-links">
                <li><a href="#">Início</a></li>
                <li><a href="#">Heróis</a></li>
                <li><a href="#">Filmes</a></li>
            </ul>
        </nav>
        <div class="hero-banner">
            <h1>OS VINGADORES</h1>
            <p>Os Maiores Heróis da Terra reunidos para salvar o universo.</p>
        </div>
    </header>

    <main class="container">
        <section class="team-section">
            <h2>Quem são os Vingadores?</h2>
            <div class="heroes-grid" id="heroes-grid">
                <!-- Os cards dos heróis serão inseridos dinamicamente aqui pelo JavaScript -->
            </div>
        </section>

        <section class="recruitment-section">
            <h2>Quer se juntar à iniciativa?</h2>
            <p>Clique abaixo para convocar um novo herói para a equipe!</p>
            <button id="add-hero-btn" class="cta-button">Convocar Herói</button>
        </section>
    </main>

    <footer>
        <p>&copy; Marvel. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
